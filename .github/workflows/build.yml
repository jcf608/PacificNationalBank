name: Enterprise Banking CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  legacy-pnb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GnuCOBOL
        run: sudo apt-get update && sudo apt-get install -y gnucobol
      - name: Build PNB COBOL
        run: make -C pnb/legacy/cobol all

  legacy-acb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ACB PL/I (transpile fallback)
        run: make -C acb/legacy/pli all

  azure-pnb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test PNB deposits service
        run: mvn -B -q test -f pnb/azure/services/pnb-deposits-service/pom.xml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest tests/integration -v
