name: PNB Build & Deploy
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "17"
  GNUCOBOL_VERSION: "3.2"

jobs:
  cobol-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol libcob4-dev
      - name: Compile COBOL
        run: make cobol
      - name: Test COBOL
        run: make test-cobol

  pli-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PL/I toolchain
        run: |
          echo "Installing iron-spring PL/I compiler"
          # Iron Spring PL/I or pli2c setup
      - name: Compile PL/I
        run: make pli

  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Build Java
        run: make java
      - name: Test Java
        run: make test-java
      - name: Upload WARs
        uses: actions/upload-artifact@v4
        with:
          name: war-files
          path: java/*/target/*.war

  docker-build:
    needs: [cobol-build, java-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: war-files
      - name: Build Docker images
        run: docker compose build
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose push

  integration-test:
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose up -d
      - name: Run integration tests
        run: make test-integration
      - name: Cleanup
        run: docker compose down
        if: always()
